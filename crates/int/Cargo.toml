[package]
name = "int"
edition = "2024"
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
rv32-isa = { path = "../rv32-isa" }
blaris-decompress = { git = "https://github.com/lis05/blaris", default-features = false, optional = true }

[features]
default = ["noop-dec"]
noop-dec = []
blaris-dec = ["dep:blaris-decompress"]
